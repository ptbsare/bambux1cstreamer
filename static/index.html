<!DOCTYPE html>
<html>
<head>
    <title>Bambu X1C Stream (Go)</title>
    <style>
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease-out;
        }
        .pie-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-image: conic-gradient(
                rgba(255, 255, 255, 0.8) var(--progress, 0deg),
                rgba(255, 255, 255, 0.2) var(--progress, 0deg)
            );
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-image 0.1s linear;
        }
        #percentage {
            color: #fff;
            font-size: 1.5em;
            font-family: sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="loader">
        <div class="pie-container">
            <span id="percentage">0%</span>
        </div>
    </div>
    <video id="video" autoplay playsinline muted></video>
    <script src="/client.js"></script>
</body>
</html>
