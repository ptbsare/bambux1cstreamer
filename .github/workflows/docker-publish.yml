name: Docker Publish CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for creating releases
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to get all history for release notes

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Git tag trigger
            type=ref,event=tag
            # Main branch trigger
            type=raw,value=beta,enable={{is_default_branch}}
            # Latest tag on new version release
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

      - name: Generate Release Notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: release_notes
        run: |
          # Get the previous tag, or the first commit if no previous tag exists
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          
          add_section() {
            local title="$1"
            local emoji="$2"
            local pattern="$3"
            local commits=$(git log --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" ${PREV_TAG}..HEAD --grep="$pattern" 2>/dev/null)
            
            if [ -n "$commits" ]; then
              echo "## ${emoji} ${title}" >> $GITHUB_OUTPUT
              echo "$commits" >> $GITHUB_OUTPUT
              echo "" >> $GITHUB_OUTPUT
            fi
          }
          
          add_section "新功能 (Features)" "🚀" "^feat"
          add_section "修复 (Bug Fixes)" "🐛" "^fix"
          add_section "文档 (Documentation)" "📚" "^docs"
          add_section "性能优化 (Performance)" "⚡" "^perf"
          add_section "重构 (Refactoring)" "♻️" "^refactor"
          add_section "持续集成 (CI)" "👷" "^ci"
          add_section "维护 (Maintenance)" "🔨" "^chore"
          
          OTHER_COMMITS=$(git log --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" ${PREV_TAG}..HEAD --invert-grep --grep="^feat\|^fix\|^docs\|^perf\|^refactor\|^ci\|^chore" 2>/dev/null)
          if [ -n "$OTHER_COMMITS" ]; then
            echo "## 📦 其他变更 (Other Changes)" >> $GITHUB_OUTPUT
            echo "$OTHER_COMMITS" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
          fi
          
          echo "---" >> $GITHUB_OUTPUT
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.release_notes.outputs.RELEASE_NOTES }}
          generate_release_notes: false